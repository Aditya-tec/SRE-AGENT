openapi: 3.0.3
info:
  title: SRE Agent Control Plane
  version: 1.0.0
  description: Read APIs and chaos trigger for the autonomous SRE demo.
servers:
  - url: http://localhost:3000
paths:
  /services:
    get:
      summary: List tracked services and latest health
      responses:
        '200':
          description: Service health snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '500':
          $ref: '#/components/responses/Error'
  /incidents:
    get:
      summary: List recent incidents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Incidents newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
        '500':
          $ref: '#/components/responses/Error'
  /incidents/{id}:
    get:
      summary: Get one incident by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /incidents/{id}/approve:
    post:
      summary: >-
        Approve and execute a paused incident's recommended remediation
        (only meaningful when AUTO_REMEDIATE=false)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Remediation executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
  /confidence-report:
    get:
      summary: >-
        Success rate of auto-remediation, broken down by the diagnosis
        confidence level that recommended it
      responses:
        '200':
          description: Per-confidence-level totals and success rate
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    total:
                      type: integer
                    resolved:
                      type: integer
                    succeeded:
                      type: integer
                    successRate:
                      type: number
                      nullable: true
        '500':
          $ref: '#/components/responses/Error'
  /autonomy:
    get:
      summary: Whether the scheduled/autonomous chaos trigger is currently paused
      responses:
        '200':
          description: Current autonomy state
          content:
            application/json:
              schema:
                type: object
                properties:
                  autonomousChaosPaused:
                    type: boolean
        '500':
          $ref: '#/components/responses/Error'
    post:
      summary: >-
        Pause or resume the scheduled/autonomous chaos trigger. A manual
        Break It call always runs regardless of this setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused:
                  type: boolean
      responses:
        '200':
          description: Updated autonomy state
          content:
            application/json:
              schema:
                type: object
                properties:
                  autonomousChaosPaused:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /metrics:
    get:
      summary: Prometheus-format metrics export
      responses:
        '200':
          description: Text exposition format
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/Error'
  /query:
    post:
      summary: Ask a natural-language question about current status/incidents
      description: >-
        Read-only. Answers are generated from the same incidents/services
        data exposed by GET /incidents and GET /services — the assistant
        cannot trigger remediation, chaos, or any other action, even if
        asked to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Plain-English answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /break-it:
    post:
      summary: Inject a fault (or named multi-step scenario)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [service, faultType]
                  properties:
                    service:
                      type: string
                      enum:
                        - order-service-a
                        - order-service-b
                        - inventory-service
                        - notification-service
                    faultType:
                      type: string
                      enum: [latency, error_rate, crash]
                    triggerType:
                      type: string
                      enum: [manual, autonomous]
                - type: object
                  required: [scenario]
                  properties:
                    scenario:
                      type: string
                      enum:
                        - cascading-failure
                        - dual-replica-pressure
                        - inventory-then-orders
                    triggerType:
                      type: string
                      enum: [manual, autonomous]
      responses:
        '202':
          description: Fault injected; incident opens after poller debounce
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidentIdPending:
                    type: boolean
                  scenario:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
components:
  schemas:
    Service:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [healthy, degraded, down]
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        lastLatencyMs:
          type: number
          nullable: true
        lastErrorRate:
          type: number
          nullable: true
    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_name:
          type: string
        trigger_type:
          type: string
        fault_type:
          type: string
        detected_at:
          type: string
          format: date-time
        diagnosed_at:
          type: string
          format: date-time
          nullable: true
        remediated_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        root_cause:
          type: string
          nullable: true
        remediation_action:
          type: string
          nullable: true
        remediation_success:
          type: boolean
          nullable: true
        postmortem:
          type: string
          nullable: true
        raw_context:
          type: object
          nullable: true
        is_flapping:
          type: boolean
          description: >-
            True if this service opened 3+ incidents within a 10-minute
            window (this one included) — usually means the underlying
            problem wasn't actually fixed by remediation, or the fault
            is inherently intermittent.
        awaiting_approval:
          type: boolean
          description: >-
            True when AUTO_REMEDIATE=false has paused this incident
            after diagnosis, pending POST /incidents/{id}/approve.
  responses:
    Error:
      description: Error payload
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
